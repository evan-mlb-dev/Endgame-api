spring.application.name=endgame-api
# --- CONFIGURATION MYSQL ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/endgame_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:endgame_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# --- JWT  ---
JWT_SECRET=${JWT_SECRET:DEFAULT_SECRET_VALUE}
JWT_EXPIRATION=${JWT_EXPIRATION:86400000}
# --- API RAWG ---
RAWG.API.KEY=${RAWG.API.KEY:DEFAULT_SECRET_VALUE}
RAWG.API.URL=${RAWG.API.URL:DEFAULT_SECRET_VALUE}
server.address=0.0.0.0